[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "educonnect-engine"
version = "0.1.0"
description = "EduConnect Engine v2"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [
  { name = "EduConnect Engineering" }
]
keywords = ["education", "finance", "clean-architecture", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.17.0",
  "pre-commit>=4.3.0",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "ruff>=0.12.7"
]

[tool.hatch.build.targets.wheel]
packages = ["src/educonnect_engine"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers --cov=educonnect_engine --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM", "ARG", "RUF"]
ignore = ["D100", "D104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
mypy_path = ["src"]
packages = ["educonnect_engine"]
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true

