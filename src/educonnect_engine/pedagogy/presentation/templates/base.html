<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Amortissements — Exercice pratique{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 780px; margin: 2rem auto; padding: 0 1.25rem;
      line-height: 1.55; color: #1c1c1c; background: #fafafa;
    }
    h1 { font-size: 1.5rem; margin-bottom: .25rem; }
    h2 { font-size: 1.1rem; margin-top: 2rem; border-bottom: 1px solid #ddd; padding-bottom: .35rem; }
    .situation {
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
      padding: 1.1rem 1.35rem; margin: 1.25rem 0 1.5rem;
    }
    .situation dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1.25rem; margin: .85rem 0 0; }
    .situation dt { font-weight: 600; color: #444; }
    .situation dd { margin: 0; }
    fieldset { border: 1px solid #ccc; border-radius: 8px; padding: 1rem 1.35rem 1.25rem; margin-bottom: 1rem; background: #fff; }
    legend { font-weight: 600; padding: 0 .4rem; }
    label { display: block; margin-top: .85rem; font-weight: 500; font-size: .95rem; }
    input[type=text] {
      width: 100%; padding: .5rem .6rem; margin-top: .3rem;
      border: 1px solid #b7b7b7; border-radius: 5px; font-size: 1rem;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    button {
      margin-top: 1rem; padding: .6rem 1.2rem; border: none; border-radius: 6px;
      background: #1f5fbf; color: #fff; font-size: 1rem; font-weight: 500; cursor: pointer;
    }
    button.secondary { background: #fff; color: #1f5fbf; border: 1px solid #1f5fbf; }
    .score { font-size: 1.15rem; font-weight: 700; margin-top: 1.25rem; }
    .feedback { list-style: none; padding: 0; margin: .75rem 0 0; }
    .feedback li { padding: .55rem .8rem; border-radius: 6px; margin-bottom: .55rem; border-left: 4px solid; font-size: .95rem; }
    .feedback .kind { text-transform: uppercase; font-size: .75rem; font-weight: 700; letter-spacing: .03em; margin-right: .4rem; }
    .feedback-correct { background: #eaf6ec; border-color: #2f9e44; }
    .feedback-hint { background: #fff7e3; border-color: #e8a300; }
    .feedback-explanation { background: #eaf1fb; border-color: #1f5fbf; }
    table { width: 100%; border-collapse: collapse; margin-top: .85rem; background: #fff; }
    th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid #e3e3e3; vertical-align: top; }
    thead th { background: #f2f2f2; }
    .cell-status { display: block; font-size: .8rem; margin-top: .3rem; font-weight: 600; }
    .correct-cell { color: #2f9e44; }
    .incorrect-cell { color: #c92a2a; }
    .calc-step { background: #fff; border: 1px solid #ddd; border-radius: 7px; padding: .8rem 1.05rem; margin-bottom: .65rem; }
    .calc-step .expr { font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 1.05rem; margin: 0 0 .3rem; }
    .error { color: #c92a2a; font-weight: 600; }
    .muted { color: #555; }
    table.journal th, table.journal td { vertical-align: middle; }
    table.journal input[type=text] { margin-top: 0; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <h1>{% block heading %}Amortissements — Exercice pratique{% endblock %}</h1>
  {% block content %}{% endblock %}
</body>
</html>
