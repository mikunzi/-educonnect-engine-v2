services:
  - type: web
    name: educonnect-engine-v2
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install .
    startCommand: uvicorn educonnect_engine.pedagogy.presentation.web:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: checksPass
